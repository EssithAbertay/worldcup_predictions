{% extends "base.html" %}

{% block content %} 

<div style="margin-bottom:100px">
<form action="" method="post">
    {{ form.hidden_tag() }}

    <div class="container ">

        <div class="border d-flex justify-content-around align-items-center gap-2 mb-4 rounded">
            <a class="btn btn-primary" style="width:30%" href="{{ url_for('upcoming_games', matchday=matchday-1) }}">
                <i class="bi bi-arrow-left-square-fill"></i>
            </a>

            <h2 class="mb-0">Matchday <br> {{ matchday }}</h2>

            <a class="btn btn-primary" style="width:30%" href="{{ url_for('upcoming_games', matchday=matchday+1) }}">
                <i class="bi bi-arrow-right-square-fill"></i>
            </a>
        </div>



        {% for prediction in form.predictions %}
            {% include '_to_predict.html' %}
        {% endfor %}


    </div>

    <input type="hidden" id="all_predictions" name="all_predictions">

    <div class="fixed-bottom p-3 bg-white border-top text-center">
        {{ form.submit(class="btn btn-primary fs-3") }}
    </div>
</form>
</div>

<script>
    const matchday = {{matchday}};
</script>

<script>
    {% if request.args.get('saved') %}
        sessionStorage.removeItem("predictions");
    {% endif %}


    window.addEventListener("DOMContentLoaded", () => {
        const predictions = JSON.parse(sessionStorage.getItem("predictions")) || {};

        if (!predictions[matchday]) return;

        for (const id in predictions[matchday]) {
            const p = predictions[matchday][id];

            document.getElementById("home_score_" + id).value = p.home;
            document.getElementById("away_score_" + id).value = p.away;

            document.getElementById("home_value_" + id).textContent = p.home;
            document.getElementById("away_value_" + id).textContent = p.away;
        }
    });

    document.querySelector("form").addEventListener("submit", function () {
        document.getElementById("all_predictions").value =
            sessionStorage.getItem("predictions") || "{}";
    });

    function checkPens(id){
        curr_home_score = parseInt(document.getElementById("home_score_" + id).value) || 0
        curr_away_score = parseInt(document.getElementById("away_score_" + id).value) || 0
        pens_box = document.getElementById("penalty_" + id)
        pens_box.style.display = curr_home_score == curr_away_score ?'block' : 'none'
    }

    let home_values = {}
    let away_values = {}

    function changeScore(value, team, id) {
        console.log("changing " + id + " " + team);

        if(team == "home")
        {
            current_score = parseInt(document.getElementById("home_score_" + id).value) || 0

            home_values[id] = current_score + value 

            //console.log(current_score " to " + home_values[id])

            
            if (home_values[id] < 0)
            {
                home_values[id]=0;
            }

            document.getElementById("home_value_" + id).innerHTML =  home_values[id];
            document.getElementById("home_score_" + id).value =  home_values[id];
        }
        else if(team == "away")
        {

            current_score = parseInt(document.getElementById("away_score_" + id).value) || 0

            away_values[id] = current_score + value 

            if (away_values[id] < 0)
            {
                away_values[id]=0;
            }

            document.getElementById("away_value_" + id).innerHTML =  away_values[id];
            document.getElementById("away_score_" + id).value =  away_values[id];
        }

        saveLocalPrediction(id);
    }


    function saveLocalPrediction(id){
        
        const predictions = JSON.parse(sessionStorage.getItem("predictions")) || {};
    
        if (!predictions[matchday]){
            predictions[matchday] = {};
        }

        predictions[matchday][id] = {
            home: document.getElementById("home_score_" + id).value,
            away: document.getElementById("away_score_" + id).value
            || ""
        };

        sessionStorage.setItem("predictions", JSON.stringify(predictions));
    }
</script>

{% endblock %}
