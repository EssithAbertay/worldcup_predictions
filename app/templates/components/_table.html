<table class="table table-hover">
    <thead>
        <tr>
        <th class="px-0 px-md-2 m-0" scope="col">#</th>
        <th class="px-0 px-md-2 m-0 text-md-start" scope="col">Team</th>
        <th class="px-0 px-md-2 m-0" scope="col">Points</th>
        <th class="px-0 px-md-2 m-0" scope="col">W-L-D</th>
        <th class="px-0 px-md-2 m-0" scope="col">GD</th>
        <th class="px-0 px-md-2 m-0" scope="col">GF</th>
        <th class="px-0 px-md-2 m-0" scope="col">GA</th>
        </tr>
    </thead>
    <tbody>

        {% for teamData in predictedTableData%}
        <tr>
        <th class="px-0 px-md-2 m-0" scope="row">{{loop.index}}</th>
        <td class="px-0 px-md-2 m-0 text-md-start">
            
            <span class="d-inline-flex align-items-center gap-2">
                <img src="{{teamData[0].logo()}}" alt="Home Logo" style="width: 32px; height: 32px;">
            <div class="d-none d-md-block">{{teamData[0].name}}</div>
        </span>
        </td>
        <td class="px-0 px-md-2 m-0">{{teamData[1]["pts"]}}</td>
        <td class="px-0 px-md-2 m-0">{{teamData[1]["w"]}}-{{teamData[1]["l"]}}-{{teamData[1]["d"]}}</td>
        <td class="px-0 px-md-2 m-0">{{teamData[1]["gd"]}}</td>
        <td class="px-0 px-md-2 m-0">{{teamData[1]["gf"]}}</td>
        <td class="px-0 px-md-2 m-0">{{teamData[1]["ga"]}}</td>
        </tr>

        {% endfor %}
    </tbody>
</table>
