<div class="card p-1"> 
     <div class="row g-0">
        <div class="col-9 fs-4">
            <span class="fi fi-{{ prediction.match.home_team.flag_code }} border rounded"></span>

            <span class="" style="width: 2rem;">
                {{ prediction.home_score_predicted }}
            </span>

            <i class="bi bi-x-diamond-fill {{ "text-success" if prediction.score_points else "text-warning" if prediction.result_points else ""}}"></i>
            
            <span class="" style="width: 2rem;">
                {{ prediction.away_score_predicted }}
            </span>

            <span class="fi fi-{{ prediction.match.away_team.flag_code}} border rounded"></span>
        </div>

        <div class="col-3 fs-4 border-start">
            {% if prediction.match.home_score is not none or prediction.match.away_score is not none%}
            {{prediction.points_awarded}} pts
            {%else%}
            <span>{{prediction.match.kickoff.strftime("%H:%M")}}</span>
            {%endif%}
        </div>
    </div>
</div>
