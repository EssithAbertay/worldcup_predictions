{% extends "base.html" %}

{% block content %}
    <h1>Leaderboard</h1>
    
    {%for user in users%}
        <p>{{ loop.index }}. <img src="{{ user.avatar(24) }}" alt="User Avatar">   <a href="{{ url_for('user', username=user.username) }}">{{user.username}}</a> - {{user.points}}</p>
    {%endfor%}
{% endblock %}
